<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestion des commandes | K-Reau</title>
<link rel="icon" href="/favicon.ico">
<style>
@font-face{font-family:'Cormorant Garamond';font-weight:500;font-display:swap;src:url(/assets/fonts/cormorant-garamond-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:400;font-display:swap;src:url(/assets/fonts/manrope-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:600;font-display:swap;src:url(/assets/fonts/manrope-latin-600-normal.woff2) format('woff2')}
:root{--ceramique:#F7F5F0;--sable:#D9BEA3;--olivier:#51573D;--olivier-fonce:#3F4430;--encre:#22211E;--blanc:#FFFEFB;--sable-clair:#EFE7DC;--joint:#E6DED3;--doux:#5E5A52;
  --afaire:#B4532A;--prep:#B8860B;--envoye:#2F6690;--livre:#3E7A4A;--annule:#8A8478}
*{box-sizing:border-box}
body{margin:0;background:var(--ceramique);color:var(--encre);font:15px/1.55 Manrope,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--encre);color:var(--blanc)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
header a{color:var(--blanc);text-decoration:none;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem}
header button{background:none;border:1px solid #6B675F;color:#D8D3C9;padding:6px 12px;cursor:pointer;font-size:.85rem}
.connexion{max-width:380px;margin:12vh auto 0;background:var(--blanc);border:1px solid var(--joint);padding:32px}
.connexion h1{font-size:2rem;margin-bottom:6px}
.connexion p{color:var(--doux);margin:0 0 20px}
label{display:block;font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--olivier);margin-bottom:6px}
input[type=password],input[type=text],input[type=search],select,textarea{width:100%;border:1px solid #CFC6B8;background:var(--blanc);padding:10px 12px;border-radius:2px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--olivier);outline-offset:1px}
.btn{background:var(--olivier);color:var(--blanc);border:0;padding:11px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--olivier-fonce)}
.btn-s{background:none;color:var(--olivier);border:1px solid var(--olivier);padding:8px 14px;font-weight:600;cursor:pointer}
.err{color:var(--afaire);font-size:.9rem;min-height:1.4em;margin:10px 0 0}
.tete{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding:32px 0 20px}
.tete h1{font-size:2.3rem;line-height:1.1}
.tete p{margin:4px 0 0;color:var(--doux)}
.outils{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.outils input{width:240px}
.outils select{width:auto}
.onglets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.onglet{border:1px solid var(--joint);background:var(--blanc);padding:7px 12px;cursor:pointer;font-size:.9rem;display:flex;gap:8px;align-items:center}
.onglet b{font-weight:600;background:var(--sable-clair);padding:0 7px;border-radius:9px;font-size:.8rem}
.onglet[aria-pressed=true]{background:var(--encre);color:var(--blanc);border-color:var(--encre)}
.onglet[aria-pressed=true] b{background:#3a3833;color:var(--blanc)}
.cmd{background:var(--blanc);border:1px solid var(--joint);border-left:5px solid var(--c,var(--afaire));margin-bottom:14px}
.cmd-tete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:14px 18px;border-bottom:1px solid var(--joint);align-items:center}
.cmd-tete strong{font-size:1.05rem}
.cmd-tete .meta{color:var(--doux);font-size:.88rem}
.pastille{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--c);padding:3px 9px;border-radius:2px}
.cmd-corps{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:18px 24px;padding:16px 18px}
.bloc h3{margin:0 0 6px;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--olivier)}
.bloc p{margin:0}
.bloc a{color:var(--olivier)}
.articles{list-style:none;margin:0;padding:0}
.articles li{padding:4px 0;border-bottom:1px dashed var(--joint)}
.articles li:last-child{border:0}
.articles .q{font-weight:600;display:inline-block;min-width:28px}
.articles .d{display:block;color:var(--doux);font-size:.85rem;padding-left:28px}
.acc{font-size:.72rem;font-weight:600;color:var(--olivier);border:1px solid var(--olivier);padding:0 5px;margin-left:6px;text-transform:uppercase}
.encadre{background:var(--sable-clair);padding:8px 10px;margin-top:8px;font-size:.9rem}
.suivi{display:grid;gap:10px}
.suivi textarea{min-height:58px;resize:vertical}
.enreg{font-size:.82rem;color:var(--livre);min-height:1.2em}
.vide{background:var(--blanc);border:1px solid var(--joint);padding:40px;text-align:center;color:var(--doux)}
.charge{padding:40px;text-align:center;color:var(--doux)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--blanc);border:1px solid var(--joint);padding:12px 14px}
.stat span{display:block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--olivier)}
.stat strong{display:block;font-size:1.45rem;font-weight:600;line-height:1.3;margin-top:2px}
.stat small{color:var(--doux);font-size:.8rem}
.stat.cle{background:var(--olivier);border-color:var(--olivier);color:var(--blanc)}.stat.cle span,.stat.cle small{color:#E3E6D6}
.stat.neg strong{color:#B4532A}.stat.cle.neg{background:#8A3A1C;border-color:#8A3A1C}.stat.cle.neg strong{color:#fff}
details.panneau{background:var(--blanc);border:1px solid var(--joint);margin-bottom:12px}
details.panneau summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--olivier);list-style-position:inside}
.panneau-corps{padding:4px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--joint);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--olivier);font-weight:600}
table.t tr.total td{font-weight:600;border-top:2px solid var(--encre);border-bottom:0}
.couts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;padding:4px 16px 16px}
.couts label{text-transform:none;letter-spacing:0;font-weight:600;font-size:.82rem;color:var(--encre)}
.couts small{display:block;color:var(--doux);font-weight:400;font-size:.75rem}
.urssaf{background:var(--blanc);border:1px solid var(--joint);border-left:5px solid var(--olivier);padding:14px 16px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center}
.urssaf h2{font-size:1.35rem;width:100%;margin:0}
.urssaf div span{display:block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--olivier)}
.urssaf div strong{font-size:1.3rem}
.urssaf p{margin:0;color:var(--doux);font-size:.85rem;width:100%}
.parcours{background:var(--blanc);border:1px solid var(--joint);padding:14px 16px;margin-bottom:12px}
.parcours .pt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.parcours .pt b{font-size:1rem}
.parcours .pt button{border:1px solid var(--joint);background:none;padding:3px 10px;border-radius:14px;font:inherit;font-size:.82rem;cursor:pointer}.parcours .pt button[aria-pressed=true]{background:var(--encre);color:#fff;border-color:var(--encre)}
.etape{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;margin:5px 0;font-size:.9rem}.etape .barre{height:22px;background:#eee8dd;border-radius:3px;overflow:hidden}.etape .barre i{display:block;height:100%;background:var(--olive,#51573D)}
.etape .v{text-align:right;font-variant-numeric:tabular-nums}.etape .v small{color:#8a8478;display:block;font-size:.75rem}
.evol{position:relative;margin:14px 0 4px;padding-top:12px;border-top:1px solid var(--joint)}
.evol-t{margin:0 0 4px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--olivier)}
.graph{display:block;width:100%;height:auto;font:11px Manrope,system-ui,sans-serif;fill:#5E5A52}
.legende{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.82rem;margin-bottom:2px}.legende i,.infobulle i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.infobulle{position:absolute;z-index:3;background:var(--blanc);border:1px solid var(--joint);box-shadow:0 4px 14px rgba(0,0,0,.08);padding:8px 10px;font-size:.82rem;line-height:1.5;pointer-events:none;white-space:nowrap}
.sources{margin-top:10px;font-size:.82rem;color:#5e5a52;display:flex;flex-wrap:wrap;gap:4px 16px}
@media(max-width:600px){.etape{grid-template-columns:100px 1fr 80px}}
.news{background:var(--blanc);border:1px solid var(--joint);padding:10px 16px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;font-size:.92rem}
.news b{font-size:1.15rem}
.abonnes{background:var(--blanc);border:1px solid var(--joint);border-top:0;padding:12px 16px;margin:-12px 0 12px}
.abo-tete{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:10px}
.news span.t{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--olivier)}
.alerte{background:#FBF1E6;border:1px solid #E9C9A6;padding:10px 14px;margin-bottom:12px;font-size:.9rem}
.alerte a{color:var(--olivier);font-weight:600;cursor:pointer;text-decoration:underline}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.panneau-corps{grid-template-columns:1fr}.couts{grid-template-columns:1fr 1fr}.panneau-corps{overflow-x:auto}}
@media (max-width:860px){.cmd-corps{grid-template-columns:1fr}.outils input{width:100%}.outils{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><a href="/">K-Reau</a><button type="button" id="deco" hidden>Se déconnecter</button></div></header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euros = c => (c / 100).toLocaleString('fr-FR', { style:'currency', currency:'EUR' });
const STATUTS = [['a-faire','À faire','--afaire'],['en-preparation','En préparation','--prep'],['envoye','Envoyé','--envoye'],['livre','Livré','--livre'],['annule','Annulé','--annule']];
const nomStatut = k => (STATUTS.find(s => s[0] === k) || STATUTS[0])[1];
const couleur = k => `var(${(STATUTS.find(s => s[0] === k) || STATUTS[0])[2]})`;
let PARCOURS = [], PPROD = [], DUREES = [], parcoursJours = '7', ABONNES = null, COUTS = {}, code = '', CMDS = [], filtre = 'a-traiter', recherche = '', jours = 90;
try { code = sessionStorage.getItem('kreau-gestion') || ''; } catch {}

async function api(corps) {
  const r = await fetch('/api/gestion', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ code, ...corps }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.erreur || 'Erreur ' + r.status); e.statut = r.status; throw e; }
  return j;
}

function vueConnexion(msg) {
  $('#deco').hidden = true;
  $('#app').innerHTML = `<form class="connexion" id="f">
    <h1>Gestion des commandes</h1><p>Espace réservé à K-Reau.</p>
    <label for="c">Code d’accès</label><input type="password" id="c" autocomplete="current-password" required autofocus>
    <p class="err" id="e" role="alert">${esc(msg || '')}</p>
    <button class="btn" type="submit" style="width:100%">Entrer</button></form>`;
  $('#f').addEventListener('submit', async e => {
    e.preventDefault(); code = $('#c').value.trim(); $('#e').textContent = '';
    const b = e.submitter || $('#f button'); b.disabled = true; b.textContent = 'Vérification…';
    try { await charger(); try { sessionStorage.setItem('kreau-gestion', code); } catch {} }
    catch (er) { b.disabled = false; b.textContent = 'Entrer'; $('#e').textContent = er.message; }
  });
}

async function charger() {
  const j = await api({ action:'liste', jours });
  CMDS = j.commandes || []; COUTS = j.couts || {}; ABONNES = j.abonnes || null; PARCOURS = j.parcours || []; PPROD = j.parcoursProduits || []; DUREES = j.durees || [];
  $('#deco').hidden = false;
  vueListe();
}

const aTraiter = c => ['a-faire','en-preparation'].includes(c.suivi.statut);
function compte(k) { return k === 'tout' ? CMDS.length : k === 'a-traiter' ? CMDS.filter(aTraiter).length : CMDS.filter(c => c.suivi.statut === k).length; }

function vueListe() {
  const onglets = [['a-traiter','À traiter'], ['tout','Toutes'], ...STATUTS.map(s => [s[0], s[1]])];
  $('#app').innerHTML = `<div class="wrap">
    <div class="tete"><div><h1>Commandes</h1><p>${CMDS.length} commande${CMDS.length > 1 ? 's' : ''} sur les ${jours} derniers jours · ${compte('a-traiter')} à traiter</p></div>
      <div class="outils"><input type="search" id="q" placeholder="Rechercher un nom, une ville, un modèle…" value="${esc(recherche)}" aria-label="Rechercher">
        <select id="j" aria-label="Période">${[30,90,180,365].map(n => `<option value="${n}" ${n === jours ? 'selected' : ''}>${n} jours</option>`).join('')}</select>
        <button class="btn-s" type="button" id="maj">Actualiser</button></div></div>
    <div id="stats"></div>
    <div class="onglets" role="group" aria-label="Filtrer par statut">${onglets.map(([k, l]) => `<button class="onglet" type="button" data-f="${k}" aria-pressed="${filtre === k}">${l} <b>${compte(k)}</b></button>`).join('')}</div>
    <div id="liste"></div></div>`;
  $('#q').addEventListener('input', e => { recherche = e.target.value; peindre(); });
  $('#j').addEventListener('change', async e => { jours = +e.target.value; $('#liste').innerHTML = '<p class="charge">Chargement…</p>'; await charger().catch(er => alert(er.message)); });
  $('#maj').addEventListener('click', async () => { $('#liste').innerHTML = '<p class="charge">Chargement…</p>'; await charger().catch(er => alert(er.message)); });
  document.querySelectorAll('.onglet').forEach(b => b.addEventListener('click', () => { filtre = b.dataset.f; document.querySelectorAll('.onglet').forEach(x => x.setAttribute('aria-pressed', x === b)); peindre(); }));
  peindreStats();
  peindre();
}

function carte(c) {
  const d = new Date(c.heure);
  const date = d.toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  const art = c.articles.map(a => {
    const titre = a.type === 'carreau' ? a.modele : a.nom;
    return `<li><span class="q">${a.q} ×</span>${esc(titre)}${a.type === 'accessoire' ? '<span class="acc">Accessoire</span>' : ''}${a.detail ? `<span class="d">${esc(a.detail)}</span>` : ''}</li>`;
  }).join('');
  const s = c.suivi;
  return `<article class="cmd" style="--c:${couleur(s.statut)}" data-id="${esc(c.id)}">
    <div class="cmd-tete"><div><strong>${esc(c.nom || c.email)}</strong> <span class="meta">· ${date} · n° ${esc(c.id.slice(-8).toUpperCase())}</span></div>
      <div class="meta"><span class="pastille" style="--c:${couleur(s.statut)}">${nomStatut(s.statut)}</span> &nbsp;${euros(c.total)}${c.code ? ' · code ' + esc(c.code) : ''}</div></div>
    <div class="cmd-corps">
      <div class="bloc"><h3>Client</h3><p>${esc(c.nom || '—')}</p><p><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p>${c.tel ? `<p><a href="tel:${esc(c.tel)}">${esc(c.tel)}</a></p>` : ''}
        <h3 style="margin-top:14px">Adresse d’envoi</h3>${c.adresse.length ? c.adresse.map(l => `<p>${esc(l)}</p>`).join('') : '<p class="meta">Pas d’envoi postal</p>'}</div>
      <div class="bloc"><h3>Articles</h3><ul class="articles">${art}</ul>
        ${c.message ? `<div class="encadre"><b>Message cadeau :</b> « ${esc(c.message)} »</div>` : ''}
        ${c.surMesure && !c.articles.some(a => a.type === 'sur-mesure' && a.detail) ? `<div class="encadre"><b>Sur mesure :</b> ${esc(c.surMesure)}</div>` : ''}
        <p class="meta" style="margin-top:8px;font-size:.85rem">Livraison : ${c.livraison ? euros(c.livraison) : 'offerte'}</p></div>
      <div class="bloc suivi"><div><h3><label for="s-${esc(c.id)}" style="all:inherit">Statut</label></h3>
          <select id="s-${esc(c.id)}" data-champ="statut">${STATUTS.map(([k, l]) => `<option value="${k}" ${k === s.statut ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div><h3>N° de suivi colis</h3><input type="text" data-champ="suivi" value="${esc(s.suivi)}" placeholder="Ex. : 6A12345678901" aria-label="Numéro de suivi"></div>
        <div><h3>Note</h3><textarea data-champ="note" placeholder="Note interne" aria-label="Note interne">${esc(s.note)}</textarea></div>
        <button type="button" class="btn-s" data-recap="${esc(c.id)}" style="padding:5px 10px;font-size:.82rem">Me renvoyer le récap par e-mail</button>
        <span class="enreg" aria-live="polite"></span></div>
    </div></article>`;
}

const CHAMPS_COUTS = [['carreau','Carreau','céramique + impression, par carreau'],['coffret','Coffret','boîte kraft du coffret de 3'],['chevalet','Chevalet','prix d’achat'],['surMesure','Dessin sur mesure','temps / sous-traitance, par carreau'],
  ['emballage','Emballage','carton, calage, étiquette, par colis'],['envoiFrance','Envoi France','affranchissement moyen par colis'],['envoiEtranger','Envoi étranger','affranchissement moyen par colis'],['urssaf','URSSAF (%)','12,4 % = vente de marchandises + formation']];
const cout = k => { const v = parseFloat(COUTS[k]); return isFinite(v) ? v * 100 : (k === 'urssaf' ? 1240 : 0); };   // en centimes (URSSAF : pourcentage × 100)
function chiffres(liste) {
  const r = { n: liste.length, ca: 0, port: 0, frais: 0, carreaux: 0, coffrets: 0, chevalets: 0, surMesure: 0, colis: 0, payantes: 0, offertes: 0, produits: 0, envoi: 0, urssaf: 0 };
  for (const c of liste) {
    r.ca += c.total; r.port += c.livraison; r.frais += c.frais || 0;
    if (c.total > 0) r.payantes++; else r.offertes++;
    const n = c.nb || {}; r.carreaux += n.carreaux || 0; r.coffrets += n.coffrets || 0; r.chevalets += n.chevalets || 0; r.surMesure += n.surMesure || 0;
    if (c.colis) { r.colis++; r.envoi += (['FR','MC',''].includes(c.pays) ? cout('envoiFrance') : cout('envoiEtranger')) + cout('emballage'); }
  }
  r.produits = r.carreaux * cout('carreau') + r.coffrets * cout('coffret') + r.chevalets * cout('chevalet') + r.surMesure * cout('surMesure');
  r.urssaf = Math.round(r.ca * cout('urssaf') / 10000);
  r.net = r.ca - r.frais - r.produits - r.envoi - r.urssaf;
  return r;
}
// Fiches produit vues et ajouts au panier, par produit (suivi démarré le 17 novembre)
function blocProduits(lim, fin) {
  const m = new Map();
  for (const x of PPROD.filter(x => x.jour >= lim && x.jour <= fin)) { const o = m.get(x.slug) || { nom: x.nom || x.slug, fiche: 0, panier: 0 }; o[x.etape] = (o[x.etape] || 0) + x.n; m.set(x.slug, o); }
  const l = [...m.values()].sort((a, b) => b.panier - a.panier || b.fiche - a.fiche);
  if (!l.length) return '<p class="meta" style="font-size:.82rem;margin:10px 0 0">Détail par produit : les chiffres apparaîtront dès les prochaines visites.</p>';
  const lignes = l.map(o => `<tr><td>${esc(o.nom)}</td><td>${o.fiche || '—'}</td><td>${o.panier || '—'}</td></tr>`);
  const tete = '<tr><th>Produit</th><th>Fiche vue</th><th>Ajouté au panier</th></tr>';
  return `<table class="t" style="margin-top:12px">${tete}${lignes.slice(0, 10).join('')}</table>${lignes.length > 10 ? `<details style="margin-top:4px"><summary class="meta" style="cursor:pointer;font-size:.85rem">Voir les ${lignes.length - 10} autres produits</summary><table class="t">${lignes.slice(10).join('')}</table></details>` : ''}`;
}

// Évolution jour par jour : visites (barres), puis fiches vues, ajouts au panier et commandes (courbes, autre échelle → autre graphique)
const SERIES_PARCOURS = [['fiche', 'Fiches vues', '#2a78d6'], ['panier', 'Ajouts au panier', '#eb6834'], ['commande', 'Commandes payées', '#1baf7a']];
function serieParcours() {
  const nb = parcoursJours === '30' ? 30 : 14, jours = [];
  for (let i = nb - 1; i >= 0; i--) { const x = new Date(); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - i); jours.push(jourParis(x)); }
  const premier = PARCOURS.reduce((m, x) => x.jour < m ? x.jour : m, '9999');   // pas de jours vides avant le début du suivi
  return jours.filter(j => j >= premier).map(j => {
    const v = e => PARCOURS.filter(x => x.jour === j && x.etape === e).reduce((a, x) => a + x.n, 0);
    return { j, visite: v('visite'), fiche: v('fiche'), panier: v('panier'),
      commande: CMDS.filter(c => jourParis(new Date(c.heure)) === j && c.suivi.statut !== 'annule').length };
  });
}
function graphiqueParcours() {
  const d = serieParcours(); if (d.length < 2) return '';
  const W = Math.round(Math.min(1000, Math.max(300, ((document.querySelector('#stats') || {}).clientWidth || 640) - 34))), H = 150, g = 34, dr = 8, h = H - 26, pas = (W - g - dr) / d.length;
  const lab = j => { const [a, m, jj] = j.split('-'); return `${+jj}/${+m}`; };
  const tick = mx => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, mx)))); const s = [1, 2, 5, 10].map(k => k * p).find(k => mx / k <= 4) || p * 10; return Math.max(1, s); };
  const axe = (mx, y) => { const s = tick(mx), top = Math.max(s, Math.ceil(mx / s) * s), out = [];
    for (let v = 0; v <= top; v += s) out.push(`<line x1="${g}" x2="${W - dr}" y1="${y(v, top)}" y2="${y(v, top)}" stroke="#E6DED3" stroke-width="1"/><text x="${g - 6}" y="${y(v, top) + 4}" text-anchor="end">${v}</text>`);
    return { top, svg: out.join('') }; };
  const xs = i => g + pas * i + pas / 2, chaque = Math.ceil(d.length / 8);
  const etiquettes = d.map((x, i) => i % chaque === 0 || i === d.length - 1 ? `<text x="${xs(i)}" y="${H - 6}" text-anchor="middle">${lab(x.j)}</text>` : '').join('');
  const y = (v, top) => 8 + (h - 8) * (1 - v / top);
  // 1. visites
  const mv = Math.max(...d.map(x => x.visite)), A = axe(mv, y), bw = Math.min(36, Math.max(3, pas - 4));
  const barres = d.map((x, i) => { const yy = y(x.visite, A.top), hh = y(0, A.top) - yy;
    return hh > 0 ? `<path d="M${xs(i) - bw / 2},${y(0, A.top)} v${-(hh - Math.min(4, hh, bw / 2))} q0,${-Math.min(4, hh, bw / 2)} ${Math.min(4, bw / 2)},${-Math.min(4, hh, bw / 2)} h${bw - 2 * Math.min(4, bw / 2)} q${Math.min(4, bw / 2)},0 ${Math.min(4, bw / 2)},${Math.min(4, hh, bw / 2)} v${hh - Math.min(4, hh, bw / 2)} z" fill="#51573D"/>` : ''; }).join('');
  // 2. fiches, paniers, commandes
  const m2 = Math.max(1, ...d.flatMap(x => SERIES_PARCOURS.map(([k]) => x[k]))), B = axe(m2, y);
  const courbes = SERIES_PARCOURS.map(([k, , c]) => `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${d.map((x, i) => `${xs(i)},${y(x[k], B.top)}`).join(' ')}"/>`
    + d.map((x, i) => x[k] ? `<circle cx="${xs(i)}" cy="${y(x[k], B.top)}" r="4" fill="${c}" stroke="#FFFEFB" stroke-width="2"/>` : '').join('')).join('');
  const zones = id => d.map((x, i) => `<rect class="zg" data-g="${id}" data-i="${i}" x="${g + pas * i}" y="0" width="${pas}" height="${H - 20}" fill="transparent"/>`).join('');
  const svg = (id, contenu, A_) => `<svg viewBox="0 0 ${W} ${H}" class="graph" role="img" aria-label="${id === 'v' ? 'Visites par jour' : 'Fiches vues, ajouts au panier et commandes par jour'}">${A_.svg}${contenu}${etiquettes}<line class="curseur" x1="0" x2="0" y1="6" y2="${h}" stroke="#8A8478" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>${zones(id)}</svg>`;
  const tableau = `<table class="t"><tr><th>Jour</th><th>Visites</th>${SERIES_PARCOURS.map(([, l]) => `<th>${l}</th>`).join('')}</tr>${d.slice().reverse().map(x => `<tr><td>${lab(x.j)}</td><td>${x.visite}</td>${SERIES_PARCOURS.map(([k]) => `<td>${x[k]}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<div class="evol"><p class="evol-t">Visites par jour</p>${svg('v', barres, A)}
    <p class="evol-t" style="margin-top:10px">Fiches vues, paniers et commandes par jour</p>
    <div class="legende">${SERIES_PARCOURS.map(([, l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>${svg('c', courbes, B)}
    <div class="infobulle" role="status" hidden></div>
    <details><summary class="meta" style="cursor:pointer;font-size:.82rem">Voir les chiffres jour par jour</summary>${tableau}</details></div>`;
}

// Durée des visites (depuis le 19 novembre) : répartition par tranche, moyenne, et moyenne par source
const TRANCHES = [['0-10', 'Moins de 10 s'], ['10-30', '10 à 30 s'], ['30-60', '30 s à 1 min'], ['60-180', '1 à 3 min'], ['180+', 'Plus de 3 min']];
const dureeTxt = s => s < 60 ? `${Math.round(s)} s` : `${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, '0')}`;
function blocDurees(lim, fin) {
  const l = DUREES.filter(x => x.jour >= lim && x.jour <= fin), n = l.reduce((a, x) => a + x.n, 0);
  if (!n) return `<div class="evol"><p class="evol-t">Durée des visites</p><p class="meta" style="font-size:.85rem;margin:0">Mesure démarrée le 19 novembre : les chiffres apparaîtront avec les prochaines visites.</p></div>`;
  const moy = l.reduce((a, x) => a + x.s, 0) / n, max = Math.max(1, ...TRANCHES.map(([k]) => l.filter(x => x.tranche === k).reduce((a, x) => a + x.n, 0)));
  const src = {}; l.forEach(x => { const o = src[x.source] || (src[x.source] = { n: 0, s: 0, court: 0 }); o.n += x.n; o.s += x.s; if (x.tranche === '0-10') o.court += x.n; });
  const noms = { pinterest:'Pinterest', instagram:'Instagram', facebook:'Facebook', google:'Google', newsletter:'Newsletter', direct:'Direct', autre:'Autres' };
  return `<div class="evol"><p class="evol-t">Durée des visites · moyenne ${dureeTxt(moy)} sur ${n} visite${n > 1 ? 's' : ''}</p>
    ${TRANCHES.map(([k, lb]) => { const v = l.filter(x => x.tranche === k).reduce((a, x) => a + x.n, 0);
      return `<div class="etape"><span>${lb}</span><span class="barre"><i style="width:${Math.max(v ? 1.5 : 0, 100 * v / max)}%"></i></span><span class="v">${v}<small>${Math.round(100 * v / n)} %</small></span></div>`; }).join('')}
    <div class="sources">${Object.entries(src).sort((a, b) => b[1].n - a[1].n).map(([k, o]) => `<span>${noms[k] || k} : <b>${dureeTxt(o.s / o.n)}</b> en moyenne · ${Math.round(100 * o.court / o.n)} % partent en moins de 10 s</span>`).join('')}</div></div>`;
}
// Parcours d'achat : visites → fiches → panier → paiement → commandes payées
const jourParis = d => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris' }).format(d);   // AAAA-MM-JJ, comme en base
function periodeParcours() {   // 'auj', 'hier', '7', '30' → bornes (jours inclus) et dates
  const j = d => { const x = new Date(); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - d); return jourParis(x); };
  if (parcoursJours === 'hier') return { lim: j(1), fin: j(1) };
  const n = parcoursJours === 'auj' ? 1 : +parcoursJours; return { lim: j(n - 1), fin: j(0) };
}
function blocParcours() {
  const { lim, fin } = periodeParcours();
  const dansPeriode = jour => jour >= lim && jour <= fin;
  const lignes = PARCOURS.filter(x => dansPeriode(x.jour));
  if (!PARCOURS.length && !CMDS.length) return '';
  const tot = e => lignes.filter(x => x.etape === e).reduce((a, x) => a + x.n, 0);
  const cmd = CMDS.filter(c => dansPeriode(jourParis(new Date(c.heure))) && c.suivi.statut !== 'annule').length;
  const et = [['Visites', tot('visite')], ['Fiche produit vue', tot('fiche')], ['Ajout au panier', tot('panier')], ['Début de paiement', tot('paiement')], ['Commande payée', cmd]];
  const max = Math.max(1, et[0][1]);
  const src = {}; lignes.filter(x => x.etape === 'visite').forEach(x => src[x.source] = (src[x.source] || 0) + x.n);
  const srcC = {}; lignes.filter(x => x.etape === 'panier').forEach(x => srcC[x.source] = (srcC[x.source] || 0) + x.n);
  const noms = { pinterest:'Pinterest', instagram:'Instagram', facebook:'Facebook', google:'Google', newsletter:'Newsletter', direct:'Direct', autre:'Autres' };
  return `<div class="parcours"><div class="pt"><b>Parcours d’achat</b><span>${[['auj', 'Aujourd’hui'], ['hier', 'Hier'], ['7', '7 jours'], ['30', '30 jours']].map(([k, l]) => `<button type="button" data-pj="${k}" aria-pressed="${k === parcoursJours}">${l}</button>`).join(' ')}</span></div>
    ${et.map(([l, v], i) => `<div class="etape"><span>${l}</span><span class="barre"><i style="width:${Math.max(v ? 1.5 : 0, 100 * v / max)}%"></i></span><span class="v">${v}${i ? `<small>${et[i - 1][1] ? Math.round(100 * v / et[i - 1][1]) + ' %' : '—'}</small>` : ''}</span></div>`).join('')}
    ${blocDurees(lim, fin)}
    ${graphiqueParcours()}
    ${blocProduits(lim, fin)}
    ${Object.keys(src).length ? `<div class="sources">${Object.entries(src).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span>${noms[k] || k} : <b>${v}</b> visite${v > 1 ? 's' : ''} → ${srcC[k] || 0} panier${(srcC[k] || 0) > 1 ? 's' : ''}</span>`).join('')}</div>` : '<div class="sources">Le suivi a démarré le 16 novembre : les chiffres se remplissent au fil des visites.</div>'}</div>`;
}

        <tr class="total"><td>Résultat net</td><td>${euros(r.net)}</td></tr></table>
        <p class="meta" style="font-size:.8rem;margin-top:8px">Les commandes offertes (code 100 %) n’apportent pas de CA mais leurs coûts sont comptés.</p></div>
      <div><table class="t"><tr><th>Mois</th><th>Cmd</th><th>Carreaux</th><th>CA à déclarer</th><th>URSSAF</th><th>Résultat</th></tr>${lignesMois || '<tr><td colspan="6">—</td></tr>'}</table>
        <table class="t" style="margin-top:16px"><tr><th>Meilleures ventes</th><th>Carreaux</th></tr>${lignesTop || '<tr><td colspan="2">—</td></tr>'}</table></div>
    </div></details>
    <details class="panneau" id="panneau-couts"><summary>Mes coûts (servent au calcul du résultat net)</summary>
      <form class="couts" id="f-couts">${CHAMPS_COUTS.map(([k, l, aide]) => `<div><label for="cout-${k}">${l} <small>${aide}</small></label><input type="text" inputmode="decimal" id="cout-${k}" name="${k}" value="${COUTS[k] != null ? String(COUTS[k]).replace('.', ',') : (k === 'urssaf' ? '12,4' : '')}" placeholder="${k === 'urssaf' ? '12,4' : '0,00 €'}"></div>`).join('')}
        <div style="grid-column:1/-1;display:flex;gap:12px;align-items:center"><button class="btn" type="submit">Enregistrer mes coûts</button><span class="enreg" id="couts-ok" aria-live="polite"></span></div></form></details>`;
  const ouvrir = $('#ouvrir-couts'); if (ouvrir) ouvrir.addEventListener('click', () => { $('#panneau-couts').open = true; $('#panneau-couts').scrollIntoView({ behavior:'smooth', block:'start' }); });
  $('#f-couts').addEventListener('submit', async e => {
    e.preventDefault(); const valeur = Object.fromEntries(new FormData(e.target)); $('#couts-ok').textContent = 'Enregistrement…';
    try { const j = await api({ action:'couts', valeur }); COUTS = j.couts || {}; peindreStats(); $('#panneau-couts').open = true; $('#couts-ok').textContent = 'Coûts enregistrés ✓'; }
    catch (er) { $('#couts-ok').textContent = er.message; }
  });
}

function peindre() {
  const q = recherche.trim().toLowerCase();
  let l = CMDS.filter(c => filtre === 'tout' ? true : filtre === 'a-traiter' ? aTraiter(c) : c.suivi.statut === filtre);
  if (q) l = l.filter(c => JSON.stringify([c.nom, c.email, c.adresse, c.articles.map(a => [a.nom, a.modele, a.detail]), c.code, c.id]).toLowerCase().includes(q));
  $('#liste').innerHTML = l.length ? l.map(carte).join('') : `<p class="vide">${filtre === 'a-traiter' && !q ? 'Rien à traiter : toutes les commandes sont envoyées. 🎉' : 'Aucune commande.'}</p>`;
  $('#liste').querySelectorAll('.cmd').forEach(el => {
    let minuteur;
    const enregistrer = async () => {
      const c = CMDS.find(x => x.id === el.dataset.id); const info = el.querySelector('.enreg');
      const v = k => el.querySelector(`[data-champ="${k}"]`).value;
      const nouveau = { statut: v('statut'), suivi: v('suivi').trim(), note: v('note').trim() };
      info.textContent = 'Enregistrement…'; info.style.color = '';
      try {
        await api({ action:'maj', session_id: c.id, ...nouveau });
        c.suivi = { ...c.suivi, ...nouveau };
        el.style.setProperty('--c', couleur(nouveau.statut));
        const p = el.querySelector('.pastille'); p.textContent = nomStatut(nouveau.statut); p.style.setProperty('--c', couleur(nouveau.statut));
        info.textContent = 'Enregistré ✓';
        document.querySelectorAll('.onglet').forEach(b => b.querySelector('b').textContent = compte(b.dataset.f));
        const ouvert = [...document.querySelectorAll('#stats details')].map(x => x.open); peindreStats(); document.querySelectorAll('#stats details').forEach((x, i) => x.open = ouvert[i]);
      } catch (er) { info.textContent = er.message; info.style.color = 'var(--afaire)'; if (er.statut === 401) vueConnexion('Session expirée, entrez le code à nouveau.'); }
    };
    el.querySelector('[data-champ="statut"]').addEventListener('change', enregistrer);
    el.querySelectorAll('[data-champ="suivi"],[data-champ="note"]').forEach(x => x.addEventListener('input', () => { clearTimeout(minuteur); minuteur = setTimeout(enregistrer, 900); }));
  });
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-recap]'); if (!b) return;
  b.disabled = true; const t = b.textContent; b.textContent = 'Envoi…';
  try { await api({ action:'recap', session_id: b.dataset.recap }); b.textContent = 'Récap envoyé ✓'; }
  catch (er) { b.textContent = er.message; } setTimeout(() => { b.textContent = t; b.disabled = false; }, 4000);
});
$('#deco').addEventListener('click', () => { code = ''; try { sessionStorage.removeItem('kreau-gestion'); } catch {} CMDS = []; vueConnexion(); });
if (code) { $('#app').innerHTML = '<p class="charge">Chargement des commandes…</p>'; charger().catch(e => vueConnexion(e.statut === 401 ? '' : e.message)); }
else vueConnexion();
</script>
</body>
</html>
